name: bloom-validator
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd bloom-validator && npm test
      - run: ./scripts/check-skill-sizes.sh
      - run: cd bloom-validator && node src/index.ts tests/fixtures/valid.html
      - run: |
          cd bloom-validator
          failed=0
          for f in ../templates/*.html ../examples/*.html; do
            [ -f "$f" ] || continue
            node src/index.ts "$f" || { echo "FAIL $f"; failed=1; }
          done
          exit $failed
