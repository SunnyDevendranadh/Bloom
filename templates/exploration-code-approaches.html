<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[TITLE] — Exploration</title>
<style>
:root {
  --ivory:    #FAF9F5;
  --slate:    #141413;
  --clay:     #D97757;
  --oat:      #E3DACC;
  --olive:    #788C5D;
  --gray-100: #F0EEE6;
  --gray-300: #D1CFC5;
  --gray-500: #87867F;
  --gray-700: #3D3D3A;
  --white:    #FFFFFF;
  --code-fg:  #E8E6DE;
  --serif: ui-serif, Georgia, "Times New Roman", serif;
  --sans:  system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:  ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--ivory);
  color: var(--gray-700);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  padding: 56px 32px 96px;
}
.page { max-width: 1360px; margin: 0 auto; }
header { margin-bottom: 48px; max-width: 760px; }
.eyebrow {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gray-500);
  margin-bottom: 12px;
}
h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 38px;
  line-height: 1.15;
  color: var(--slate);
  margin-bottom: 18px;
  letter-spacing: -0.01em;
}
.prompt-box {
  background: var(--gray-100);
  border: 1.5px solid var(--gray-300);
  border-radius: 12px;
  padding: 16px 20px;
  font-size: 14.5px;
}
.prompt-box .label {
  font-family: var(--mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--gray-500);
  display: block;
  margin-bottom: 6px;
}
.approaches {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(316px, 1fr));
  gap: 28px;
  margin-bottom: 56px;
}
.approach {
  background: var(--white);
  border: 1.5px solid var(--gray-300);
  border-radius: 12px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.approach-head h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 21px;
  color: var(--slate);
  margin-bottom: 6px;
}
.approach-head .num {
  font-family: var(--mono);
  font-size: 12px;
  background: var(--oat);
  color: var(--slate);
  padding: 2px 8px;
  border-radius: 8px;
  margin-right: 8px;
}
.approach-head p { font-size: 14px; color: var(--gray-500); }
.code {
  background: var(--slate);
  border-radius: 12px;
  padding: 18px 20px;
  overflow-x: auto;
}
.code pre {
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.65;
  color: var(--code-fg);
  white-space: pre;
}
.tradeoffs {
  border: 1.5px solid var(--gray-300);
  border-radius: 8px;
  overflow: hidden;
  font-size: 13px;
}
.tradeoffs .row { display: grid; grid-template-columns: 1fr 1fr; }
.tradeoffs .row + .row { border-top: 1.5px solid var(--gray-300); }
.tradeoffs .cell { padding: 10px 14px; }
.tradeoffs .cell:first-child { border-right: 1.5px solid var(--gray-300); }
.tradeoffs .head {
  background: var(--gray-100);
  font-weight: 600;
  color: var(--slate);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.tradeoffs .pro::before, .tradeoffs .con::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-right: 8px;
  vertical-align: 2px;
}
.tradeoffs .pro::before { background: var(--olive); }
.tradeoffs .con::before { background: var(--clay); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-family: var(--mono);
  font-size: 11.5px;
  background: var(--gray-100);
  border: 1.5px solid var(--gray-300);
  color: var(--gray-700);
  padding: 5px 10px;
  border-radius: 8px;
}
.chip strong { color: var(--slate); }
.reco {
  border-left: 4px solid var(--clay);
  background: var(--white);
  border-radius: 0 12px 12px 0;
  padding: 24px 28px;
  max-width: 860px;
}
.reco h2 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 22px;
  color: var(--slate);
  margin-bottom: 10px;
}
.reco p { font-size: 15px; margin-bottom: 8px; }
.reco code {
  font-family: var(--mono);
  font-size: 0.92em;
  background: var(--gray-100);
  padding: 1px 6px;
  border-radius: 4px;
}
@media (max-width: 1100px) {
  .approaches { grid-template-columns: 1fr; }
}
a:focus-visible, button:focus-visible, .approach:focus-visible {
  outline: 2px solid var(--clay); outline-offset: 2px; border-radius: 4px;
}
@media (max-width: 640px) { .page { padding: 1rem; } }
@media (max-width: 960px) { .page { max-width: 100%; } }
@media print {
  body { background: var(--ivory); color: var(--slate); padding: 24px; }
  .approaches { grid-template-columns: 1fr; }
  .approach { break-inside: avoid; }
  .code { background: var(--gray-100); }
  .code pre { color: var(--slate); }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="eyebrow">Exploration · [CONTEXT]</div>
    <h1>[TITLE]</h1>
    <div class="prompt-box">
      <span class="label">Prompt</span>
      [PROMPT TEXT]
    </div>
  </header>
  <main>
  <section class="approaches">
    <!-- Approach 1 -->
    <article class="approach">
      <header class="approach-head">
        <h2><span class="num">01</span>[APPROACH NAME]</h2>
        <p>[ONE-LINE DESCRIPTION]</p>
      </header>
      <div class="code"><pre>[CODE SAMPLE]</pre></div>
      <div class="tradeoffs">
        <div class="row head"><div class="cell">Pro</div><div class="cell">Con</div></div>
        <div class="row"><div class="cell pro">[PRO 1]</div><div class="cell con">[CON 1]</div></div>
        <div class="row"><div class="cell pro">[PRO 2]</div><div class="cell con">[CON 2]</div></div>
      </div>
      <div class="chips">
        <span class="chip">Bundle: <strong>[SIZE]</strong></span>
        <span class="chip">Testability: <strong>[LEVEL]</strong></span>
      </div>
    </article>
    <!-- Add more approaches as needed -->
  </section>
  <aside class="reco">
    <h2>Recommendation</h2>
    <p>[RECOMMENDATION WITH RATIONALE]</p>
  </aside>
  </main>
</div>
</body>
</html>
