<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[PROJECT] — Status Report</title>
<style>
:root {
  --ivory:#FAF9F5;--slate:#141413;--clay:#D97757;--oat:#E3DACC;--olive:#788C5D;
  --rust:#B04A3F;--gray-100:#F0EEE6;--gray-300:#D1CFC5;--gray-500:#87867F;
  --gray-700:#3D3D3A;--white:#FFFFFF;--sand:#B89B6E;
  --serif:ui-serif,Georgia,serif;--sans:system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}body{background:var(--ivory);color:var(--slate);font-family:var(--sans);font-size:15px;line-height:1.6;padding:56px 24px 120px;-webkit-font-smoothing:antialiased}
.page{max-width:860px;margin:0 auto}
header{margin-bottom:40px}
.header-top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:8px}
h1{font-family:var(--serif);font-weight:500;font-size:38px;letter-spacing:-0.01em;margin:0}
.auto-pill{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);background:var(--gray-100);border:1.5px solid var(--gray-300);border-radius:999px;padding:5px 11px}
.date-range{color:var(--gray-500);font-size:14px}
section{margin-bottom:52px}
h2{font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:-0.01em;margin:0 0 6px}
hr.rule{border:none;border-top:1px solid var(--gray-300);margin:0 0 22px}
.summary-band{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:720px){.summary-band{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--white);border:1.5px solid var(--gray-300);border-radius:12px;padding:20px 22px 18px}
.stat-card.warn{border-left:4px solid var(--clay);padding-left:19px}
.stat-num{font-family:var(--serif);font-size:44px;font-weight:500;line-height:1;color:var(--slate);margin-bottom:8px}
.stat-label{font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:var(--gray-500)}
.stat-delta{font-family:var(--mono);font-size:11px;margin-top:6px}
.stat-delta.up{color:var(--olive)}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--white);border:1.5px solid var(--gray-300);border-radius:12px;overflow:hidden}
  thead th{text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-500);background:var(--gray-100);padding:12px 16px;border-bottom:1px solid var(--gray-300)}
  .col-pr{width:90px}.col-author{width:140px}.col-risk{width:100px}
  tbody td{padding:13px 16px;border-bottom:1px solid var(--gray-100);font-size:14px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--ivory)}
  .risk{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--gray-500)}
  .pr-link{font-family:var(--mono);font-size:13px;color:var(--clay);text-decoration:none}.author-cell{font-size:13px;color:var(--gray-700)}
.risk-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.risk-dot.low{background:var(--olive)}.risk-dot.med{background:var(--sand)}.risk-dot.high{background:var(--clay)}
.highlights{list-style:none;padding:0}
.highlights li{position:relative;padding:0 0 14px 26px;font-size:15px;color:var(--gray-700)}
.highlights li::before{content:"";position:absolute;left:6px;top:8px;width:7px;height:7px;border-radius:2px;background:var(--clay)}
.highlights li strong{color:var(--slate);font-weight:600}
a:focus-visible,button:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:4px}
@media print{
  body{background:var(--ivory);color:var(--slate);padding:24px}
  .auto-pill{display:none}
  section{break-inside:avoid}
  a{color:var(--slate);text-decoration:underline}
}
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="header-top">
      <h1>[PROJECT] — Week [NUM]</h1>
      <span class="auto-pill">auto-generated</span>
    </div>
    <div class="date-range">[DATE RANGE]</div>
  </header>
  <main>

  <section>
    <div class="summary-band">
      <div class="stat-card"><div class="stat-num">[NUM]</div><div class="stat-label">[METRIC]</div><div class="stat-delta up">[DELTA]</div></div>
      <div class="stat-card"><div class="stat-num">[NUM]</div><div class="stat-label">[METRIC]</div><div class="stat-delta">[DELTA]</div></div>
      <div class="stat-card warn"><div class="stat-num">[NUM]</div><div class="stat-label">[METRIC]</div><div class="stat-delta">[DELTA]</div></div>
      <div class="stat-card"><div class="stat-num">[NUM]</div><div class="stat-label">[METRIC]</div><div class="stat-delta up">[DELTA]</div></div>
    </div>
  </section>

  <section>
    <h2>Highlights</h2>
    <hr class="rule">
    <ul class="highlights">
      <li><strong>[HIGHLIGHT TITLE].</strong> [DESCRIPTION]</li>
    </ul>
  </section>

  <section>
    <h2>Shipped</h2>
    <hr class="rule">
    <table>
      <thead><tr><th class="col-pr">PR</th><th>Title</th><th class="col-author">Author</th><th class="col-risk">Risk</th></tr></thead>
      <tbody>
        <tr><td><a class="pr-link" href="#">#[NUM]</a></td><td>[TITLE]</td><td class="author-cell">[AUTHOR]</td><td><span class="risk"><span class="risk-dot med"></span>Med</span></td></tr>
      </tbody>
    </table>
  </section>
  </main>
</div>
</body>
</html>
